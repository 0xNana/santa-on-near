[package]
name = "santa-near"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["test-token"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.1", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
