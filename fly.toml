# NEAR Testnet app: https://santa-near-testnet.fly.dev
# Keep one Machine while relayer coordination and limits are process-local.
app = "santa-near-testnet"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[build.args]
  NEXT_PUBLIC_NEAR_CONTRACT_ACCOUNT = "gifts.santa-gifts.testnet"
  NEXT_PUBLIC_NEAR_TOKEN_ACCOUNT_IDS = "token.santa-gifts.testnet"
  SANTA_PUBLIC_ORIGIN = "https://santa-near-testnet.fly.dev"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[env]
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  NODE_ENV = "production"
  NEAR_NETWORK_ID = "testnet"
  NEAR_RPC_URL = "https://rpc.testnet.near.org"
  NEAR_CONTRACT_ACCOUNT = "gifts.santa-gifts.testnet"
  NEAR_RELAYER_ACCOUNT = "relayer.santa-gifts.testnet"
  SANTA_PUBLIC_ORIGIN = "https://santa-near-testnet.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "60s"
    interval = "60s"
    method = "GET"
    timeout = "15s"
    path = "/api/near/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
